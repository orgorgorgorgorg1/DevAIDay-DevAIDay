version: 2
# Trimmed config for the DevAI Day demo: minimal noise, just enough to
# showcase Dependabot security updates.
#
# NOTE on ignore rules: blocking all routine version-update PRs (major/minor/
# patch) effectively limits Dependabot to SECURITY update PRs only. Security
# updates are NOT affected by `ignore` rules, so the demo CVE alerts still
# get auto-fix PRs.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "nuget"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directory: "/demo/legacy-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "npm"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
