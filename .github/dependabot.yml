version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    # Skip major version bumps - they almost always contain breaking API
    # changes that fail the build (e.g. MediatR 12->14, Swashbuckle 7->10).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test-dependencies:
        patterns:
          - "*Test*"
          - "Moq"
          - "xunit*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/src/Web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/src/PublicApi"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
